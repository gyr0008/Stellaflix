<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stellaflix</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.085), transparent 31%),
        rgba(4,5,7,.96);
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      user-select: none;
    }
    .boot { display: grid; justify-items: center; gap: 15px; transform: translateY(-2vh); }
    .mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 18px 52px rgba(0,0,0,.42);
    }
    .mark svg {
      width: 54px;
      height: 54px;
      display: block;
    }
    .name { font-size: 18px; font-weight: 650; letter-spacing: .02em; }
    .status { color: rgba(255,255,255,.48); font-size: 12px; letter-spacing: .08em; }
    .dots { display: flex; gap: 7px; height: 8px; }
    .dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      animation: pulse 1.05s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .14s; }
    .dots i:nth-child(3) { animation-delay: .28s; }
    @keyframes pulse {
      0%, 70%, 100% { opacity: .2; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <main class="boot" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="300" rx="64" fill="#F7F4EC"/>
        <ellipse cx="150" cy="160" rx="128" ry="34" fill="none" stroke="#2E2B26" stroke-width="14" transform="rotate(-16 150 160)"/>
        <circle cx="150" cy="148" r="70" fill="#5B7A9D"/>
        <path d="M 45 178 A 128 34 -16 0 0 150 190" fill="none" stroke="#2E2B26" stroke-width="14" stroke-linecap="round"/>
        <path d="M 232 118 L 246 146 L 232 138 L 218 146 Z" fill="#2E2B26"/>
      </svg>
    </div>
    <div class="name">Stellaflix</div>
    <div class="status">正在启动播放器</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
